function dragBars(el,cfg){const {labels,min,max,step,vals,fmt,refs}=cfg,H=cfg.h||230;
 const y=v=>H-(v-min)/(max-min)*H,z=y(min<0?0:min);
 el.innerHTML=`<div class="dbars">${labels.map((l,i)=>`<div class="dcol"><div class="dval"></div><div class="dtrack" data-i="${i}" style="height:${H}px">${min<0?`<div class="dzero" style="top:${z}px"></div>`:''}${refs?`<div class="dref" style="top:${y(refs[i])}px;height:${z-y(refs[i])}px"></div>`:''}<div class="dfill"></div><div class="dknob"></div></div><div class="dlab">${l}</div></div>`).join('')}</div>`;
 const tracks=[...el.querySelectorAll('.dtrack')];
 const draw=i=>{const t=tracks[i],v=vals[i],f=t.querySelector('.dfill');const top=v>=0?y(v):z,h=Math.abs(y(v)-z);
  f.style.top=top+'px';f.style.height=Math.max(2,h)+'px';f.classList.toggle('neg',v<0);t.querySelector('.dknob').style.top=y(v)+'px';t.parentNode.querySelector('.dval').textContent=fmt(v)};
 tracks.forEach((t,i)=>{draw(i);const set=e=>{const r=t.getBoundingClientRect();let v=min+(1-(e.clientY-r.top)/r.height)*(max-min);v=Math.round(v/step)*step;v=Math.max(min,Math.min(max,v));vals[i]=+v.toFixed(2);draw(i);cfg.onChange&&cfg.onChange(vals)};
  let on=false;t.addEventListener('pointerdown',e=>{e.preventDefault();on=true;try{t.setPointerCapture(e.pointerId)}catch(_){}set(e)});
  t.addEventListener('pointermove',e=>{if(on){e.preventDefault();set(e)}});['pointerup','pointercancel','lostpointercapture'].forEach(n=>t.addEventListener(n,()=>on=false))});
}

const prime=p=>Math.round(p.rev*.15/10)*10;
const revenu=(p,k)=>p.rev+(k===2?prime(p):0);
function fixedList(p,k){return p.fixed.map(([l,a,c,f])=>[l,Math.round(a*(k===4&&f===1?PRIX_NRJ:k===4&&f===2?PRIX_ALI:1)),c,k===4&&!!f])}
const foodPrice=(p,i,k)=>Math.round(FOOD[i][2]*p.m*(k===4?PRIX_ALI:1)/5)*5;
const shopPrice=(p,i)=>{const s=SHOP[i];return Math.round(s[2]*(s[4]?p.m:1)/5)*5};
function buildMove(p,k,food,cart){const conso={},add=(c,a)=>conso[c]=(conso[c]||0)+a;
 fixedList(p,k).forEach(([l,a,c])=>add(c,a));add('ALI',foodPrice(p,food,k));cart.forEach(i=>add(SHOP[i][3],shopPrice(p,i)));
 const total=Object.values(conso).reduce((a,b)=>a+b,0),R=revenu(p,k);return {revenu:R,conso_total:total,epargne:R-total,conso}}
function botMove(p,k,seed){const R=revenu(p,k),food=seed.food;let C=p.rev*seed.pmc;
 if(k===2)C+=prime(p)*seed.pmg;if(k===3)C-=p.rev*seed.prec;if(k===4)C*=seed.infl;
 const conso={};fixedList(p,k).forEach(([l,a,c])=>conso[c]=(conso[c]||0)+a);conso.ALI=(conso.ALI||0)+foodPrice(p,food,k);
 const base=Object.values(conso).reduce((a,b)=>a+b,0),D=Math.max(0,Math.min(C,R)-base);
 const w={LOI:rnd(.3,.55),HAB:rnd(.08,.2),EQU:rnd(.08,.25),TRA:rnd(.04,.12),SAN:rnd(.03,.1)},sw=Object.values(w).reduce((a,b)=>a+b,0);
 Object.entries(w).forEach(([c,v])=>conso[c]=(conso[c]||0)+Math.round(D*v/sw));
 const total=Object.values(conso).reduce((a,b)=>a+b,0);return {revenu:R,conso_total:total,epargne:R-total,conso}}
const botSeed=p=>({pmc:p.pmc+rnd(-.05,.04),pmg:rnd(.38,.72),prec:rnd(.04,.1),infl:rnd(1.01,1.05),food:Math.floor(rnd(0,3))});
function agg(moves,k){const m=moves.filter(x=>x.month===k);const R=m.reduce((a,x)=>a+x.revenu,0),C=m.reduce((a,x)=>a+x.conso_total,0);
 const cat={};m.forEach(x=>Object.entries(x.conso||{}).forEach(([c,v])=>cat[c]=(cat[c]||0)+v));return {n:m.length,R,C,E:R-C,pmc:C/R,taux:(R-C)/R,cat}}
function pmgClass(moves){const by={};moves.forEach(x=>{if(x.month<=2)(by[x.player]=by[x.player]||{})[x.month]=x});
 let dR=0,dC=0;Object.values(by).forEach(o=>{if(o[1]&&o[2]){dR+=o[2].revenu-o[1].revenu;dC+=o[2].conso_total-o[1].conso_total}});return {dR,dC,pmg:dC/dR}}

  return TAG('MOIS 3 · LA RUMEUR')+H2("Votre taux d'épargne, mois après mois")+`<svg viewBox="0 0 620 270" style="max-width:720px;width:100%;margin:0 auto"><line x1="40" y1="230" x2="600" y2="230" stroke="rgba(255,255,255,.2)"/><defs><linearGradient id="gl"><stop offset="0" stop-color="#38e1d6"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient></defs>

   ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="#070b14" stroke="${i===2?'#ff5fa2':'#38e1d6'}" stroke-width="4"/><text x="${p[0]}" y="${p[1]-20}" fill="#eaf2ff" font-size="20" font-weight="600" text-anchor="middle">${pct(ts[i],1)}</text><text x="${p[0]}" y="258" fill="#8797b3" font-size="15" text-anchor="middle">${['Mois 1','Mois 2 · prime','Mois 3 · rumeur'][i]}</text>`).join('')}</svg>
   <div class="hero-num ${d>=0?'grad':''} pop" style="font-size:clamp(50px,8vw,90px)">${sgn(d)} pts</div><div class="stamp">ÉPARGNE DE PRÉCAUTION</div><div class="sub">Votre revenu n'a pas changé entre le mois 1 et le mois 3 : seule l'<b style="color:var(--ink)">incertitude</b> a changé. En France, au 2<sup>e</sup> trimestre 2025, le taux d'épargne a atteint 18,9 % — un record depuis plus de 40 ans hors Covid.</div>`}
 if(k===4&&step===0){const a3=agg(TE.moves,3);return TAG('MOIS 4 · LA FLAMBÉE DES PRIX')+H2("Même revenu. Prix de l'alimentation +12 %, énergie +20 %.")+`<div class="kpis" style="max-width:820px;margin:0 auto;width:100%"><div class="glass kpi"><small>REVENU (mois 3 → 4)</small><b style="font-size:22px">${eur(a3.R)} → ${eur(ak.R)}</b></div><div class="glass kpi"><small>ALIMENTATION + ÉNERGIE</small><b style="color:var(--red);font-size:22px">▲ hausse des prix</b></div><div class="glass kpi"><small>ÉPARGNE DE LA CLASSE</small><b style="font-size:22px">${eur(a3.E)} → ${eur(ak.E)}</b></div></div>
  <div class="hero-num grad pop" style="font-size:clamp(42px,7vw,80px)">Revenu stable · Prix ↑</div><div class="stamp">POUVOIR D'ACHAT ↓</div><div class="formula">Évolution du pouvoir d'achat ≈ évolution du revenu − évolution des prix</div><div class="sub">Avec le même revenu, vous pouvez acheter moins : votre pouvoir d'achat a baissé. C'est ce qu'ont vécu les ménages français en 2025 (−0,4 %, Insee). Séance suivante : chacun son inflation.</div>`}
 const s1=(a1.cat.ALI||0)/a1.C,s4=(ak.cat.ALI||0)/ak.C;
 return TAG("MOIS 4 · LA PART DE L'ALIMENTATION")+H2("Part de l'alimentation dans les dépenses de la classe")+`<div class="hbars"><div class="hb"><span>Mois 1</span><div class="t"><i data-w="${s1*300}%"></i></div><span class="v">${pct(s1,1)}</span></div><div class="hb"><span>Mois 4 (prix ↑)</span><div class="t"><i data-w="${s4*300}%" style="background:linear-gradient(90deg,#ffb547,#ff5d6c)"></i></div><span class="v">${pct(s4,1)}</span></div></div><div class="stamp">COEFFICIENT BUDGÉTAIRE · EFFET PRIX</div><div class="sub">Avez-vous mangé davantage ? Non : c'est le <b style="color:var(--ink)">prix relatif</b> de l'alimentation qui a augmenté. Une part qui grimpe en valeur ne veut pas dire plus de quantités. Rendez-vous au 3.3.</div>`;
}
function revS2(k,step){const M=c=>TE.moves.filter(x=>x.month===c),nm=id=>{const p=TE.players.find(x=>x.id===id);return p?esc(p.name):'?'};
 if(k===1){const ws=M(21).map(x=>x.conso.w),av={},mn={},mx={};POSTES.forEach(([c])=>{const v=ws.map(w=>w[c]);av[c]=mean(v);mn[c]=Math.min(...v);mx[c]=Math.max(...v)});
  return TAG('ÉTAPE 1 · VOS PANIERS')+H2('Le panier moyen de la classe')+`<div class="hbars">${POSTES.map(([c,e,l])=>`<div class="hb"><span>${e} ${l}</span><div class="t"><i data-w="${(av[c]||0)/40*100}%"></i></div><span class="v">${dec(av[c],0)} %</span></div>`).join('')}</div>
  <div class="sub mono" style="font-size:14px">Mais derrière la moyenne : le logement va de ${dec(mn.LOG,0)} % à ${dec(mx.LOG,0)} % selon les élèves, les loisirs de ${dec(mn.LOI,0)} % à ${dec(mx.LOI,0)} %.</div>
  <div class="stamp">PANIER DE BIENS · INDICE DES PRIX (IPC)</div><div class="sub">L'Insee fait exactement la même chose à l'échelle du pays : un panier moyen, pondéré par le poids de chaque poste, actualisé chaque année. L'évolution de son prix, c'est l'inflation.</div>`}
 if(k===2&&step===0){const r=M(22),infs=r.map(x=>x.conso.inf),av=mean(infs),lo=r.reduce((a,x)=>!a||x.conso.inf<a.conso.inf?x:a,null),hi=r.reduce((a,x)=>!a||x.conso.inf>a.conso.inf?x:a,null);
  const A=-6,B=15,X=v=>(v-A)/(B-A)*100,cnt={};
  return TAG('ÉTAPE 2 · LE CHOC DES PRIX')+H2('Chaque point = l\'inflation personnelle d\'un élève')+`<div class="dotplot">${[-5,0,5,10,15].map(t=>`<span class="tk" style="left:${X(t)}%">${sgn(t,0)} %</span>`).join('')}<div class="ax"></div>
   ${infs.map((v,i)=>{const b=Math.round(v*2)/2;cnt[b]=(cnt[b]||0)+1;return `<span class="d" style="left:${X(v)}%;top:${Math.max(4,150-cnt[b]*18)}px;animation-delay:${i*40}ms"></span>`}).join('')}<div class="mean" style="left:${X(av)}%"><span>moyenne ${sgn(av)} %</span></div></div>
   <div class="kpis" style="max-width:760px;margin:0 auto;width:100%"><div class="glass kpi"><small>LA PLUS FAIBLE</small><b style="color:var(--green)">${lo?sgn(lo.conso.inf):'—'} %</b><span class="sub">${lo?nm(lo.player):''}</span></div><div class="glass kpi"><small>« IPC » DE LA CLASSE</small><b style="color:var(--amber)">${sgn(av)} %</b></div><div class="glass kpi"><small>LA PLUS FORTE</small><b style="color:var(--red)">${hi?sgn(hi.conso.inf):'—'} %</b><span class="sub">${hi?nm(hi.player):''}</span></div></div>
   <div class="stamp">INFLATION ≠ INFLATION RESSENTIE</div><div class="sub">Mêmes hausses de prix pour tout le monde… mais pas les mêmes paniers. L'IPC est une moyenne : personne ne vit exactement l'inflation officielle.</div>`}
 if(k===2){const r=M(22),gain=r.filter(x=>REV_UP-x.conso.inf>.05).length,lose=r.filter(x=>REV_UP-x.conso.inf<-.05).length,okp=r.length?r.filter(x=>x.conso.ok).length/r.length:NaN;
  return TAG('ÉTAPE 2 · REVENU +3 %')+H2(`Tout le monde a reçu +${REV_UP} % de revenu. Résultat :`)+`<div class="kpis" style="max-width:760px;margin:0 auto;width:100%"><div class="glass kpi" style="text-align:center"><small>POUVOIR D'ACHAT EN HAUSSE</small><b style="font-size:64px;color:var(--green)">${gain}</b></div><div class="glass kpi" style="text-align:center"><small>POUVOIR D'ACHAT EN BAISSE</small><b style="font-size:64px;color:var(--red)">${lose}</b></div></div>
  <div class="formula">Pouvoir d'achat ≈ évolution du revenu − évolution des prix</div><div class="stamp">POUVOIR D'ACHAT · REVENU NOMINAL ≠ RÉEL</div><div class="sub">Un revenu qui augmente en euros (nominal) ne garantit rien : seul compte l'écart avec les prix (réel). ${pct(okp)} de la classe a trouvé la bonne réponse pour son propre cas.</div>`}
 const gs=M(23).map(x=>x.conso.g),av=PA_REAL.map((_,i)=>mean(gs.map(g=>g[i]))),best=M(23).map(x=>({p:x.player,e:mean(x.conso.g.map((v,i)=>Math.abs(v-PA_REAL[i][1])))})).sort((a,b)=>a.e-b.e)[0];
 const A=-2,B=5,Y=v=>230-(v-A)/(B-A)*210,z=Y(0);
 return TAG('ÉTAPE 3 · LA CONJONCTURE')+H2("Pouvoir d'achat des ménages : vos prédictions vs l'Insee")+`<svg viewBox="0 0 640 270" style="max-width:780px;width:100%;margin:0 auto"><line x1="30" y1="${z}" x2="620" y2="${z}" stroke="rgba(255,255,255,.35)"/>
  ${PA_REAL.map(([y,v],i)=>{const x=60+i*95,top=Math.min(Y(v),z),h=Math.abs(Y(v)-z),gy=Math.min(Y(av[i]),z),gh=Math.abs(Y(av[i])-z);
   return `<rect x="${x-4}" y="${gy}" width="62" height="${Math.max(2,gh)}" fill="none" stroke="#ffb547" stroke-width="2" stroke-dasharray="5 4" rx="4"/><rect x="${x+6}" y="${top}" width="42" height="${Math.max(2,h)}" rx="4" fill="${v<0?'#ff5d6c':'url(#gb)'}" style="transform-origin:0 ${z}px;animation:grow .9s ${.2+i*.15}s both"/>
   <text x="${x+27}" y="${v<0?Y(v)+18:Y(v)-8}" fill="#eaf2ff" font-size="16" font-weight="600" text-anchor="middle">${sgn(v)}</text><text x="${x+27}" y="262" fill="#8797b3" font-size="14" text-anchor="middle">${y}</text>`}).join('')}
  <defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38e1d6"/><stop offset="1" stop-color="#9b7bff"/></linearGradient></defs></svg>
  <div class="row sub mono" style="justify-content:center;font-size:13px;gap:18px"><span style="color:#38e1d6">▮ Insee (réel)</span><span style="color:#ffb547">⬚ moyenne de vos prédictions</span></div>
  ${best?`<div class="sub">🎯 Meilleure prédiction : <b style="color:var(--ink)">${nm(best.p)}</b> (écart moyen ${dec(best.e,1)} pt)</div>`:''}
  <div class="stamp">ÉVOLUTION DU POUVOIR D'ACHAT</div><div class="sub">Sur longue période, le pouvoir d'achat des ménages a fortement progressé grâce aux gains de productivité. Mais il peut reculer certaines années : en 2025, le revenu (+0,5 %) a progressé moins vite que les prix (Insee).</div>`;
}
function revS3(k,step){const M=c=>TE.moves.filter(x=>x.month===c),nm=id=>{const p=TE.players.find(x=>x.id===id);return p?esc(p.name):'?'};
 if(k===1&&step===0){const ps=M(31),av={};P3.forEach(([c])=>av[c]=mean(ps.map(x=>x.conso.p[c])));const best=ps.map(x=>({p:x.player,e:mean(P3.map(([c,,,,r])=>Math.abs(x.conso.p[c]-r)))})).sort((a,b)=>a.e-b.e)[0];
  return `<div class="year grad" id="yr">1960</div><div class="tm">${P3.map(([c,e,l,a,r])=>`<div class="tmr"><span>${e} ${l}</span><div class="tmt"><i data-a="${a}" data-r="${r}" style="width:${a/40*100}%"></i><span class="gh" data-l="vous : ${dec(av[c],0)} %" style="left:${(av[c]||0)/40*100}%"></span></div><span class="tmv" data-a="${a}" data-r="${r}">${a} %</span></div>`).join('')}</div>
   <div class="sub mono" style="font-size:13px">▮ orange = moyenne de vos prédictions</div>${best?`<div class="sub">🎯 Meilleure prédiction : <b style="color:var(--ink)">${nm(best.p)}</b> (écart moyen ${dec(best.e,1)} pt)</div>`:''}
   <div class="stamp" style="animation-delay:3.4s">COEFFICIENTS BUDGÉTAIRES</div><div class="sub">Part de chaque poste dans la dépense de consommation des ménages (Insee). Logement 2023 : ordre de grandeur.</div>`}
 if(k===1)return TAG('ÉTAPE 1 · CE QUE RACONTE LA MACHINE')+H2('Pourquoi le budget s\'est-il déformé ?')+`<div class="kpis" style="max-width:900px;margin:0 auto;width:100%;text-align:left">
   <div class="glass kpi"><small>🥖 ALIMENTATION</small><b>29 % → 15,9 %</b><span class="sub">Quand le revenu augmente, la dépense alimentaire augmente moins vite : sa part baisse.</span></div>
   <div class="glass kpi"><small>🏠 LOGEMENT</small><b>24 % → ≈ 31 %</b><span class="sub">Le logement pèse de plus en plus : loyers et prix de l'immobilier ont fortement progressé.</span></div>
   <div class="glass kpi"><small>🛎️ SERVICES</small><b>½ → ⅔</b><span class="sub">Santé, loisirs, communication : les services représentent aujourd'hui les deux tiers de la consommation.</span></div></div>
   <div class="stamp">LOI D'ENGEL</div><div class="formula">Coefficient budgétaire = dépense du poste / dépense totale × 100</div>`;
 const vs=M(32),rows=VV.map((x,i)=>({x,ok:vs.length?vs.filter(v=>v.conso.v[i]===x[2]).length/vs.length:NaN}));
 return TAG('ÉTAPE 2 · VALEUR OU VOLUME ?')+H2('Vos réponses, situation par situation')+`<div style="max-width:960px;margin:0 auto;width:100%">${rows.map(({x,ok})=>`<div class="qrow"><div>${x[0]} ${esc(x[1])}<small>${x[2]==='P'?'💶 EFFET PRIX':'📦 EFFET VOLUME'} — ${esc(x[3])}</small></div><div class="hb" style="grid-template-columns:1fr"><div class="t"><i data-w="${(ok||0)*100}%"></i></div></div><span class="mono" style="font-weight:600">${pct(ok)}</span></div>`).join('')}</div>
  <div class="stamp">VALEUR · VOLUME · PRIX RELATIF</div><div class="sub">En valeur = prix × quantités. En volume = quantités seules. Devant une part qui bouge, toujours se demander : est-ce le prix, ou la quantité ?</div>`;
}
function timeMachine(){const yr=$('#yr'),bars=$$('.tmt i'),vals=$$('.tmv');let t=0;
 const it=setInterval(()=>{t=Math.min(1,t+1/60);const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;yr.textContent=Math.round(1960+63*e);
  bars.forEach(b=>{const a=+b.dataset.a,r=+b.dataset.r;b.style.width=(a+(r-a)*e)/40*100+'%'});vals.forEach(v=>{const a=+v.dataset.a,r=+v.dataset.r;v.textContent=dec(a+(r-a)*e,1)+' %'});if(t>=1)clearInterval(it)},50)}
function tQuizReveal(){const Q=QUIZ[tmode()],rows=Q.map((q,i)=>{const r=TE.moves.filter(x=>x.month===100+i);return {q,ok:r.length?r.filter(x=>x.conso.ok).length/r.length:NaN}});
 W().innerHTML=tHeader()+`<div class="reveal fade">${TAG('DÉFI ÉCLAIR · RÉSULTATS DE LA CLASSE')}${H2('Taux de bonnes réponses')}<div style="max-width:960px;margin:0 auto;width:100%">${rows.map(({q,ok},i)=>`<div class="qrow"><div><b>${i+1}.</b> ${esc(q[0])}<small>✓ ${esc(q[1])}</small></div><div class="hb" style="grid-template-columns:1fr"><div class="t"><i data-w="${(ok||0)*100}%"></i></div></div><span class="mono" style="font-weight:600">${pct(ok)}</span></div>`).join('')}</div>
 <div class="sub">Reprenez la question la moins réussie avec la classe.</div><div class="row" style="justify-content:center"><button class="btn go" id="nx">Bilan de la séance →</button></div></div>`;$('#nx').onclick=()=>setState(nextState(TE.state));animateBars()}
function tEnd(){const m=tmode(),quizOk=mean([0,1,2,3].map(i=>{const r=TE.moves.filter(x=>x.month===100+i);return r.length?r.filter(x=>x.conso.ok).length/r.length:NaN}).filter(Number.isFinite));let kp='',chips=[],title='';
 if(m==='s1'){const all=[1,2,3,4].map(k=>agg(TE.moves,k)),R=all.reduce((a,x)=>a+x.R,0),C=all.reduce((a,x)=>a+x.C,0),E=R-C,ids=new Set(TE.moves.filter(x=>x.month<=4).map(x=>x.player)),pat=TE.players.filter(p=>ids.has(p.id)).reduce((a,p)=>a+PROFILES[p.profile].pat,0);
  title='Votre classe <span class="grad">vs la France</span>';
  kp=`<div class="glass kpi"><small>PMC DE LA CLASSE</small><b>${dec(C/R)}</b></div><div class="glass kpi"><small>PmC (PRIME)</small><b>${dec(pmgClass(TE.moves).pmg)}</b></div><div class="glass kpi"><small>TAUX D'ÉPARGNE · FRANCE 2025</small><b>${pct(E/R,1)} · ${String(FRANCE_TAUX).replace('.',',')} %</b></div><div class="glass kpi"><small>PATRIMOINE CUMULÉ</small><b style="font-size:20px">${eur(pat)} → ${eur(pat+E)}</b></div>`;
  chips=['Propension moyenne à consommer',"Taux d'épargne",'Déterminants : revenu, âge, cycle de vie','Propension marginale à consommer','Épargne de précaution','Épargne = flux · patrimoine = stock',"Pouvoir d'achat (aperçu)",'Coefficient budgétaire (aperçu)']}
 else if(m==='s2'){const infs=TE.moves.filter(x=>x.month===22).map(x=>x.conso.inf);title='Chacun <span class="grad">son inflation</span>';
  kp=`<div class="glass kpi"><small>« IPC » DE LA CLASSE</small><b>${sgn(mean(infs))} %</b></div><div class="glass kpi"><small>ÉCART MIN → MAX</small><b>${infs.length?sgn(Math.min(...infs))+' → '+sgn(Math.max(...infs)):'—'} %</b></div><div class="glass kpi"><small>POUVOIR D'ACHAT EN BAISSE (+3 %)</small><b>${infs.filter(v=>REV_UP-v<-.05).length} élèves</b></div>`;
  chips=['Panier de biens et services','Indice des prix à la consommation (IPC)','Inflation','Inflation ressentie','Pouvoir d\'achat','Revenu nominal / réel',"Évolution du pouvoir d'achat"]}
 else{const ps=TE.moves.filter(x=>x.month===31),err=mean(ps.map(x=>mean(P3.map(([c,,,,r])=>Math.abs(x.conso.p[c]-r))))),vs=TE.moves.filter(x=>x.month===32),vok=mean(vs.map(v=>VV.filter((x,i)=>v.conso.v[i]===x[2]).length/4));title='Le budget <span class="grad">a voyagé dans le temps</span>';
  kp=`<div class="glass kpi"><small>ÉCART MOYEN DES PRÉDICTIONS</small><b>${dec(err,1)} pt</b></div><div class="glass kpi"><small>VALEUR / VOLUME RÉUSSIS</small><b>${pct(vok)}</b></div>`;
  chips=['Structure de consommation','Coefficient budgétaire',"Loi d'Engel",'Valeur / volume','Prix relatif','Progression des services']}
 W().innerHTML=tHeader()+`<div class="fade" style="display:grid;gap:18px"><div style="text-align:center"><div class="sub mono">BILAN · SOUS-THÈME ${SEANCES[m].code}</div><h1 class="big">${title}</h1></div>
  <div class="kpis">${kp}<div class="glass kpi"><small>DÉFI ÉCLAIR</small><b>${pct(quizOk)}</b></div></div>
  <div class="glass pad"><div class="sect" style="margin-top:0">Notions découvertes en jouant</div><div class="players">${chips.map(t=>`<span class="chipp done">✓ ${t}</span>`).join('')}</div></div>
  <div class="sub" style="text-align:center">Chaque élève découvre son bilan personnel sur son iPad.</div><div class="row" style="justify-content:center"><button class="btn ghost" id="again">Nouvelle séance</button></div></div>`;
 $('#again').onclick=()=>{clearInterval(TE.timer);store.del('mos_teacher');teacherStart()}}

/* ================= DÉMARRAGE ================= */
if(qs.get('prof')!==null)teacherStart();
else if(qs.get('r'))studentJoin(qs.get('r').toUpperCase());
else if(store.get('mos_student'))studentJoin();
else landing();

</script>
